<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FolderPicker — preview</title>
<style>html, body { margin: 0; background: var(--color-surface-page); }</style></head>
<body>
<div class="cl-root" style="padding: 16px; max-width: 592px;">
<div class="cl-field cl-field--text"><span class="cl-field__label">Archive old databases to</span><span class="cl-pathfield"><input class="cl-input" placeholder="none: deleted past the size" aria-label="Archive folder"><button class="cl-btn" aria-expanded="true">Choose…</button></span></div>
<div style="height: 8px;"></div>
<div class="cl-folder" role="group" aria-label="Choose the archive folder"><div class="cl-folder__places"><button class="cl-folder__place" aria-current="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.75" y="5" width="12.5" height="6" rx="1.5"/><path d="M11.25 8h.01"/></svg>Archive <span class="cl-folder__free">1.8 TB free</span></button><button class="cl-folder__place" aria-current="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.75" y="5" width="12.5" height="6" rx="1.5"/><path d="M11.25 8h.01"/></svg>Macintosh HD <span class="cl-folder__free">210 GB free</span></button><button class="cl-folder__place" aria-current="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 7.5 8 3l5.5 4.5M4 6.5V13h8V6.5"/></svg>Home</button></div><nav class="cl-folder__crumbs" aria-label="Open folder"><button>/</button><button>Volumes</button><span class="cl-folder__sep" aria-hidden="true">/</span><button>Archive</button><span class="cl-folder__sep" aria-hidden="true">/</span><button aria-current="location">clairance</button></nav><ul class="cl-folder__list" aria-label="Folders in clairance"><li><button class="cl-folder__row"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4.25c0-.55.45-1 1-1h3.25l1.5 1.5H13c.55 0 1 .45 1 1v6c0 .55-.45 1-1 1H3c-.55 0-1-.45-1-1z"/></svg><span>bases</span></button></li><li><button class="cl-folder__row"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4.25c0-.55.45-1 1-1h3.25l1.5 1.5H13c.55 0 1 .45 1 1v6c0 .55-.45 1-1 1H3c-.55 0-1-.45-1-1z"/></svg><span>exports</span></button></li><li><button class="cl-folder__row"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4.25c0-.55.45-1 1-1h3.25l1.5 1.5H13c.55 0 1 .45 1 1v6c0 .55-.45 1-1 1H3c-.55 0-1-.45-1-1z"/></svg><span>Old Mac</span><span class="cl-folder__note">read only</span></button></li></ul><div class="cl-folder__foot"><span class="cl-plain">1.8 TB free on Archive.</span><span class="cl-row"><button class="cl-btn cl-btn--quiet">Cancel</button><button class="cl-btn cl-btn--primary">Choose this folder</button></span></div></div>
</div>
</body>
</html>
