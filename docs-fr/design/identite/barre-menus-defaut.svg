<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" width="18" height="18" role="img" aria-label="Clairance running with a fault">
  <title>Menu bar, production running but something fails (deaf, no audio, no transcription, disk): the scope with the warning triangle</title>
  <!-- Not a template image, like the lit state: it must stay amber. The
       status lights' warning shape (a triangle) in place of the sweep; the
       dark disc (surface.warn) keeps it readable on a light bar as on a dark
       one. It wins over the lit state: a deaf production never looks on air. -->
  <circle cx="9" cy="9" r="8.4" fill="#2e2410"/>
  <circle cx="9" cy="9" r="7.2" fill="none" stroke="#f5b83d" stroke-width="1.6"/>
  <path d="M9 5.2 L12.9 11.9 L5.1 11.9 Z" fill="#f5b83d" stroke="#f5b83d" stroke-width="0.6" stroke-linejoin="round"/>
</svg>
