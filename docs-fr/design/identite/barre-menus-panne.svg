<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" width="18" height="18" role="img" aria-label="Clairance down">
  <title>Menu bar, production down: stopped by itself or not answering; the scope with the failure square</title>
  <!-- Not a template image. The status lights' failure shape (a square) in
       the empty scope; the dark disc (surface.urgent) keeps the red readable
       on both bars. Stopped by choice stays the grey empty scope: off is not
       a fault. -->
  <circle cx="9" cy="9" r="8.4" fill="#2b1214"/>
  <circle cx="9" cy="9" r="7.2" fill="none" stroke="#ff6e6e" stroke-width="1.6"/>
  <rect x="6.2" y="6.2" width="5.6" height="5.6" rx="0.8" fill="#ff6e6e"/>
</svg>
