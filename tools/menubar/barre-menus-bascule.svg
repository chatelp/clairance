<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" width="18" height="18" role="img" aria-label="Clairance starting or stopping">
  <title>Menu bar, production starting or stopping: the scope with the switching half-disc</title>
  <!-- A template image, like stopped and running: the ring of the scope and,
       at its centre, the status lights' switching mark (half a disc), for the
       few seconds a start or a stop takes. Never animated. -->
  <circle cx="9" cy="9" r="7.2" fill="none" stroke="#000000" stroke-width="1.6"/>
  <circle cx="9" cy="9" r="3.1" fill="none" stroke="#000000" stroke-width="1.3"/>
  <path d="M9 5.9 A3.1 3.1 0 0 0 9 12.1 Z" fill="#000000"/>
</svg>
